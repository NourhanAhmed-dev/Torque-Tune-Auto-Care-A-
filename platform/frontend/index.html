<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Torque-Tune — Customer Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/css/style.css"/>
<script>
  if (localStorage.getItem("tt_theme") === "dark")
    document.documentElement.setAttribute("data-theme", "dark");
</script>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <span class="brand"><span class="brand-logo">🔧</span> Torque-Tune</span>
    <span class="top-actions">
      <button id="theme_btn" class="btn btn-ghost btn-sm" onclick="toggleTheme()">🌙</button>
      <a class="btn btn-ghost btn-sm" href="/admin">🛡️ Admin</a>
    </span>
  </div>
</header>

<nav class="sidebar">
  <span class="brand"><span class="brand-logo">🔧</span> Torque-Tune</span>
  <span class="grp">Assistants</span>
  <!-- <a href="#" data-agent="tech" class="on">🛠️ Technician</a> -->
  <a href="#" data-agent="build">🏁 Performance Build</a>
  <a href="#" data-agent="rescue">🚛 Fleet Rescue</a>
  <a href="#" data-agent="warranty">🛡️ Warranty</a>
</nav>

<main class="container">
  <h1>Hi there 👋</h1>
  <p class="subtitle">Pick an assistant from the side — everything happens right here in chat.</p>
  <section class="card">
    <h2><span class="h-icon ai-chat">💬</span> <span id="chat_title">Chat with the technician</span></h2>
    <div id="chat"></div>
    <div class="row" style="margin-top:10px">
      <input id="chat_in" placeholder="Type your message…" onkeydown="if(event.key==='Enter')sendChat()"/>
      <button class="btn btn-primary" style="flex:none" onclick="sendChat()">Send ➤</button>
    </div>
    <p class="hint" id="chat_hint">Example: “list available vehicles”</p>
  </section>
</main>
<script src="/js/api.js"></script>
<script src="/js/customer.js"></script>
</body>
</html>
